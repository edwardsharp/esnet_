---
layout: archive
title: archive
description: an archive of interactive sketchz and experimentz by 3dwardsharp.
---

<div id="home">
  <ul class="posts">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url }}">
        <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date_to_string }}</time>
        <span aria-hidden="true">&raquo;</span>
        <span class="post-title">{{ post.title }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
